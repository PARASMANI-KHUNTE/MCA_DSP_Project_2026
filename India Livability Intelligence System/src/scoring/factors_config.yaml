factors:
  air_quality:
    column: air_quality
    direction: lower_is_better
    level: city
    trend: eligible
    bounds:
    - 27.91
    - 150.6
    source_id: air_kaggle
    notes: Historic Kaggle/CBC series plus enriched 2025-2026 station data. Flag covid_year
      for 2020 and sparse_observations for thin recent coverage. Source changes start
      a new trend segment.
  safety:
    column: safety
    direction: lower_is_better
    level: state
    trend: never
    bounds:
    - 119.7
    - 1274.8
    source_id: safety_ncrb
    notes: Crime rate reflects reporting practices as well as actual crime. Series
      break in 2024.
  health:
    column: health
    direction: higher_is_better
    level: state
    trend: never
    bounds:
    - 44.33
    - 72.33
    source_id: health_nfhs5
    notes: NFHS-5 district factsheets aggregated to states; local extraction unverified
  economy:
    level: state
    trend: never
    indicators:
    - column: per_capita_nsdp_constant
      direction: higher_is_better
      bounds:
      - 51898.0
      - 272219.8
      source_id: economy_rbi_nsdp
    - column: unemployment_rate
      direction: lower_is_better
      bounds:
      - 1.24
      - 7.12
      source_id: economy_plfs
    notes: Normalize each indicator separately then average inside the factor. Only
      years where both exist.
  cost_of_living:
    column: cost_of_living
    direction: lower_is_better
    level: city
    trend: never
    bounds:
    - 5731.0
    - 27366.0
    source_id: cost_of_living_longitudinal
    notes: Optional toggle. 2010-2024 city rents (average of city-centre and outside-centre
      1BHK). PLFS-modelled rows are flagged modeled_estimate; Numbeo-derived rows
      are flagged reference_estimate. Show 'no trend available'.
  water_quality:
    column: water_quality
    direction: higher_is_better
    level: state
    trend: never
    bounds:
    - 42.26
    - 96.33
    source_id: water_quality_cpcb
    notes: 'Optional state-level factor. CPCB water-body quality snapshot (2021):
      mean BOD (lower is better) and dissolved oxygen (higher is better), rescaled
      to 0-100. Coliform readings retained for context only.'
eligibility:
  min_valid_points_for_trend: 5
  snapshot_label: No trend available
  insufficient_label: Insufficient data
presets:
  balanced:
    air_quality: 35
    safety: 25
    health: 25
    economy: 15
  environmental:
    air_quality: 55
    safety: 15
    health: 20
    economy: 10
  family:
    air_quality: 20
    safety: 40
    health: 30
    economy: 10
  career:
    air_quality: 10
    safety: 20
    health: 20
    economy: 50
  student:
    air_quality: 15
    safety: 25
    health: 15
    economy: 20
    cost_of_living: 25
